# =============================================================
# mongo-service.yaml
# Service: expone MongoDB dentro del cluster con un nombre estable.
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: inventario-db        # nombre por el que Flask encuentra a Mongo
  namespace: inventario
spec:
  type: ClusterIP            # solo accesible dentro del cluster
  selector:
    app: mongodb               # apunta a los pods con la etiqueta app=mongo
  ports:
    - protocol: TCP
      port: 27017            # puerto del Service
      targetPort: 27017      # puerto del contenedor de Mongo
