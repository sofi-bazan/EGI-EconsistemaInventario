# =============================================================
# 02-frontend-policy.yaml
# Políticas para el pod Flask (app: frontend).
# =============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: inventario
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Acepta tráfico en el puerto 5000 desde cualquier origen.
    # pfSense ya actúa como primer firewall antes de que el paquete
    # llegue al NodePort de Minikube.
    - ports:
        - protocol: TCP
          port: 5000

  egress:
    # --- MongoDB (pod interno, ClusterIP) ---
    - to:
        - podSelector:
            matchLabels:
              app: mongodb
      ports:
        - protocol: TCP
          port: 27017

    # --- SQL Server (VM externa, Infraestructura B) ---
    - to:
        - ipBlock:
            cidr: 192.168.1.20/32
      ports:
        - protocol: TCP
          port: 1433

    # --- Active Directory / LDAP (VM externa) ---
    - to:
        - ipBlock:
            cidr: 192.168.1.10/32
      ports:
        - protocol: TCP
          port: 389
