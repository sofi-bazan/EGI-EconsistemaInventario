# =============================================================
# 01-allow-dns.yaml
# Permite que todos los pods resuelvan DNS (kube-dns / CoreDNS).
# =============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: inventario
spec:
  podSelector: {}       # aplica a todos los pods del namespace
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
