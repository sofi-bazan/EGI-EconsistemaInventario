apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: inventario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: inventario-egi
          imagePullPolicy: Never        # imagen local de Minikube
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: inventario-config   # variables no sensibles (hosts, puertos)
            - secretRef:
                name: sqlserver-secret    # variables sensibles (contraseñas)