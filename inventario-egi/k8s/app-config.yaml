# =============================================================
# app-config.yaml
# ConfigMap (no sensible) + Secret (sensible) para la app.
# El frontend-deployment.yaml ya hace envFrom: secretRef: sqlserver-secret,
# se recomienda agregar tambien el configMapRef de abajo.
# =============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventario-config
  namespace: inventario
data:
  SQL_HOST: "ubicacion-db"
  SQL_PORT: "1433"
  SQL_DATABASE: "Inventario"
  MONGO_HOST: "inventario-db"
  MONGO_PORT: "27017"
  MONGO_DB: "inventario"
  MONGO_COLLECTION: "hardware"
  LDAP_HOST: "ldap-service"
  LDAP_PORT: "389"
  LDAP_DOMAIN: "itu.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver-secret
  namespace: inventario
type: Opaque
stringData:
  SECRET_KEY: "cambiar-esta-clave-por-una-larga-y-aleatoria"
  SQL_USER: "sa"
  SQL_PASSWORD: "TuPasswordFuerte123"
  MONGO_USER: ""
  MONGO_PASSWORD: ""
